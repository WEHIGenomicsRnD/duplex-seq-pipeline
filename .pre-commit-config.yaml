repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.6.2
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "3.2.1"
    hooks:
      - id: editorconfig-checker
        alias: ec
        exclude: ^(modules/nf-core|subworkflows/nf-core)/|dag\.pdf$|\.(fasta|gz)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(modules/nf-core|subworkflows/nf-core|workflow|config|slurm|tests/data)/
      - id: end-of-file-fixer
        exclude: ^(modules/nf-core|subworkflows/nf-core|workflow|config|slurm|tests/data)/|dag\.pdf$
  - repo: https://github.com/seqeralabs/nf-lint-pre-commit
    rev: v0.2.0
    hooks:
      - id: nextflow-lint
        args: ["-format"]
        # nf-test.config uses nf-test's own config syntax, which nextflow lint cannot parse
        exclude: ^(modules/nf-core|subworkflows/nf-core)/|^nf-test\.config$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.0
    hooks:
      - id: check-metaschema
        files: ^(nextflow_schema|assets/schema_input)\.json$
