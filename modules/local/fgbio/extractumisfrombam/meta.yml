name: fgbio_extractumisfrombam
description: |
  Extracts unique molecular identifiers (UMIs) from the read sequences of an unmapped BAM into read tags, following a
  read structure. The read structure and the tags (RX, and ZA/ZB with --molecular-index-tags) are set with
  `task.ext.args`; in this pipeline they come from `conf/modules.config`.
keywords:
  - UMI
  - fgbio
  - extract
  - duplex
  - unmapped bam
tools:
  - fgbio:
      description: A set of tools for working with genomic and high throughput sequencing data, including UMIs
      homepage: http://fulcrumgenomics.github.io/fgbio/
      documentation: http://fulcrumgenomics.github.io/fgbio/tools/latest/
      tool_dev_url: https://github.com/fulcrumgenomics/fgbio
      licence: ["MIT"]
      identifier: biotools:fgbio
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: Unmapped BAM file (for example from Picard FastqToSam)
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572"
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bam":
          type: file
          description: Unmapped BAM file with the UMIs extracted into tags
          pattern: "*.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572"
  versions_fgbio:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fgbio:
          type: string
          description: The tool name
      - 'fgbio --version 2>&1 | tr -d "[:cntrl:]" | sed -e "s/^.*Version: //;s/\[.*$//"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fgbio:
          type: string
          description: The tool name
      - 'fgbio --version 2>&1 | tr -d "[:cntrl:]" | sed -e "s/^.*Version: //;s/\[.*$//"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@mcmero"
maintainers:
  - "@mcmero"
