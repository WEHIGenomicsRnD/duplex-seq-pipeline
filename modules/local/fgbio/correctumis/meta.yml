name: fgbio_correctumis
description: |
  Corrects the UMIs of a BAM file against a list of known UMIs. Reads whose UMI cannot be matched to a known UMI are
  removed. The maximum number of mismatches and the minimum distance between UMIs are set with `task.ext.args`.
keywords:
  - UMI
  - fgbio
  - correct
  - duplex
  - unmapped bam
tools:
  - fgbio:
      description: A set of tools for working with genomic and high throughput sequencing data, including UMIs
      homepage: http://fulcrumgenomics.github.io/fgbio/
      documentation: http://fulcrumgenomics.github.io/fgbio/tools/latest/
      tool_dev_url: https://github.com/fulcrumgenomics/fgbio
      licence: ["MIT"]
      identifier: biotools:fgbio
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM file with the UMIs in a tag (for example from fgbio ExtractUmisFromBam)
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572"
    - umis:
        type: file
        description: Text file with the known UMI sequences, one per line
        pattern: "*.txt"
        ontologies: []
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bam":
          type: file
          description: BAM file with the corrected UMIs
          pattern: "*.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572"
  versions_fgbio:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fgbio:
          type: string
          description: The tool name
      - 'fgbio --version 2>&1 | tr -d "[:cntrl:]" | sed -e "s/^.*Version: //;s/\[.*$//"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - fgbio:
          type: string
          description: The tool name
      - 'fgbio --version 2>&1 | tr -d "[:cntrl:]" | sed -e "s/^.*Version: //;s/\[.*$//"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@mcmero"
maintainers:
  - "@mcmero"
